# Local-only by default: bind to this computer and send no usage statistics.
[server]
address = "127.0.0.1"
headless = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#245EA8"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#E9EEF3"
textColor = "#17212B"
font = "sans serif"
